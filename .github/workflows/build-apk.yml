name: Android Build Workflow

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KEYSTORE_PASSWORD: Abc123456789@xyz
  KEY_ALIAS: auto_key
  KEY_PASSWORD: Abc123456789@xyz

jobs:
  Release_Build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate & Save Keystore
        run: |
          if [ ! -f "app/release-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore "app/release-key.jks" \
              -alias "auto_key" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ env.KEYSTORE_PASSWORD }}" \
              -keypass "${{ env.KEY_PASSWORD }}" \
              -dname "CN=Android App,OU=Dev,O=Company,L=City,ST=Province,C=CN"

            git config --global user.name "Github Actions Bot"
            git config --global user.email "actions@github.com"
            git add app/release-key.jks
            git commit -m "Auto save keystore file, reuse next build"
            git push
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: app/build/outputs/apk/release/*.apk
